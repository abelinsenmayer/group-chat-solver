[project]
name = "group-chat-solver-backend"
version = "0.1.0"
description = "Backend for group chat solver"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.1.4",
    "ollama>=0.4",
    "requests>=2.32",
    "scipy>=1.15.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain>=1.0.0",
    "tavily>=0.5.0",
    "pydantic-settings>=2.0",
    "langsmith>=0.1.0",
    "langchain-google-genai>=4.0.0,<4.3.0",
    "levenshtein>=0.27.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
